<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convex Schema Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0c0d14 0%, #161b2b 100%);
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      background: rgba(12, 13, 20, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      color: #60a5fa;
      filter: drop-shadow(0 2px 6px rgba(59, 130, 246, 0.4));
    }

    .connection-panel {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .input-group {
      position: relative;
    }

    .input-group input {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: #e2e8f0;
      font-size: 0.9rem;
      width: 350px;
      transition: all 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      background: rgba(30, 41, 59, 0.9);
    }

    .input-group input::placeholder {
      color: #64748b;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1.5rem;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .workspace {
      position: fixed;
      top: 80px;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
    }

    .sidebar {
      width: 300px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-right: 1px solid #1e293b;
      padding: 1.25rem;
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar .search {
      margin-bottom: 0.75rem;
    }

    .sidebar .search input {
      width: 100%;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.6rem 0.75rem;
      color: #e2e8f0;
      font-size: 0.9rem;
    }

    .table-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .table-item {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-item:hover {
      background: rgba(30, 41, 59, 0.75);
      border-color: #3b82f6;
      transform: translateY(-1px);
    }

    .table-item.active {
      background: rgba(30, 58, 138, 0.5);
      border-color: #60a5fa;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #1e293b;
      background: rgba(2, 6, 23, 0.4);
      backdrop-filter: blur(8px);
    }

    .chip {
      border: 1px solid #334155;
      background: rgba(30, 41, 59, 0.6);
      color: #e2e8f0;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .chip.active {
      border-color: #3b82f6;
      background: rgba(30, 64, 175, 0.35);
    }

    .canvas-wrap {
      position: relative;
      flex: 1;
      overflow: auto;
      background: radial-gradient(1200px 600px at 20% -20%, rgba(59, 130, 246, 0.12), transparent),
                  radial-gradient(900px 500px at 80% 0%, rgba(139, 92, 246, 0.12), transparent);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(51, 65, 85, 0.35) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(51, 65, 85, 0.35) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 60%, transparent 100%);
      pointer-events: none;
    }

    .nodes {
      position: relative;
      min-width: 1200px;
      min-height: 800px;
      padding: 40px;
    }

    .node {
      position: absolute;
      width: 280px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 0.75rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
    }

    .node:hover {
      border-color: #3b82f6;
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
    }

    .node-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid #1f2937;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.85));
    }

    .node-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .node-badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid #334155;
      color: #cbd5e1;
      background: rgba(2, 6, 23, 0.5);
    }

    .fields {
      padding: 0.5rem 0.5rem 0.6rem 0.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 8px;
      align-items: center;
    }

    .field-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.85rem;
      color: #e5e7eb;
      padding: 0.35rem 0.5rem;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      border-radius: 0.375rem;
    }

    .field-type {
      font-size: 0.75rem;
      color: #93c5fd;
      background: rgba(30, 64, 175, 0.35);
      border: 1px solid #1d4ed8;
      padding: 0.25rem 0.45rem;
      border-radius: 0.375rem;
    }

    svg.connections {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .inspector {
      width: 360px;
      border-left: 1px solid #1e293b;
      background: rgba(2, 6, 23, 0.55);
      padding: 1rem;
      overflow-y: auto;
    }

    .inspector h3 {
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }

    .inspector pre {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem;
      overflow: auto;
      font-size: 0.85rem;
      line-height: 1.45;
    }

    @media (max-width: 1200px) {
      .inspector {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 7.5L12 3l8 4.5v9L12 21l-8-4.5v-9z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 3v18M4 7.5l8 4.5 8-4.5" stroke="currentColor" stroke-opacity="0.5"/>
      </svg>
      <h1>Convex Schema Visualizer</h1>
    </div>
    <div class="connection-panel">
      <div class="input-group">
        <input id="endpointInput" type="text" placeholder="Convex deployment URL or paste schema JSON..." />
      </div>
      <button id="connectBtn" class="btn-primary">Load</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <h3>
        <span>Tables</span>
      </h3>
      <div class="search">
        <input id="tableSearch" type="text" placeholder="Filter tables..." />
      </div>
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <button id="addTableBtn" class="chip">+ Table</button>
        <button id="exportBtn" class="chip">Export</button>
        <button id="importBtn" class="chip">Import</button>
      </div>
      <div id="tableList" class="table-list"></div>
    </aside>

    <main class="content">
      <div class="toolbar">
        <button id="graphTab" class="chip active">Graph</button>
        <button id="jsonTab" class="chip">JSON</button>
        <button id="functionsTab" class="chip">Functions</button>
        <button id="validateBtn" class="chip">Validate</button>
        <button id="shareBtn" class="chip">Share</button>
      </div>
             <div class="canvas-wrap" id="canvasWrap">
        <div class="grid"></div>
        <svg class="connections" id="connections" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="nodes" id="nodes"></div>
        <div id="jsonView" style="display:none; padding:16px;">
          <textarea id="jsonEditor" style="width:100%; height: calc(100vh - 160px); background: rgba(15,23,42,0.85); color:#e2e8f0; border:1px solid #334155; border-radius:8px; padding:12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, &quot;Liberation Mono&quot;, &quot;Courier New&quot;, monospace; font-size:13px;"></textarea>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button id="applyJsonBtn" class="btn-primary">Apply</button>
            <button id="formatJsonBtn" class="chip">Format</button>
          </div>
        </div>
        <div id="functionsView" style="display:none; padding:16px;">
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
            <select id="functionsSelect" style="min-width:180px; background: rgba(30,41,59,.6); border:1px solid #334155; color:#e2e8f0; padding:6px 8px; border-radius:6px;"></select>
            <input id="functionNameInput" placeholder="Function name" style="min-width:220px; background: rgba(30,41,59,.6); border:1px solid #334155; color:#e2e8f0; padding:6px 8px; border-radius:6px;"/>
            <button id="newFunctionBtn" class="chip">New</button>
            <button id="saveFunctionBtn" class="btn-primary">Save</button>
            <button id="deleteFunctionBtn" class="chip">Delete</button>
            <button id="exportFunctionsBtn" class="chip">Export</button>
            <button id="importFunctionsBtn" class="chip">Import</button>
            <button id="runChainBtn" class="chip">Run</button>
            <span id="runChainStatus" style="color:#94a3b8; font-size:12px;"></span>
          </div>
          <div style="display:flex; gap:16px; align-items:flex-start;">
            <div style="flex: 2;">
              <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
                <button id="addStepBtn" class="btn-primary">+ Step</button>
              </div>
              <div id="stepsList" class="table-list"></div>
            </div>
            <div style="flex: 1; min-width:280px;">
              <h4 style="margin-bottom:6px;">Params</h4>
              <textarea id="paramsEditor" style="width:100%; height:160px; background: rgba(15,23,42,0.85); color:#e2e8f0; border:1px solid #334155; border-radius:8px; padding:10px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, &quot;Liberation Mono&quot;, &quot;Courier New&quot;, monospace; font-size:12px;">{}</textarea>
            </div>
          </div>
          <h4 style="margin-top:12px;">Result</h4>
          <pre id="chainResult" style="background: rgba(15,23,42,0.85); border:1px solid #334155; border-radius:8px; padding:12px; min-height:120px;"></pre>
        </div>
      </div>
    </main>

         <aside class="inspector" id="inspector">
      <h3>Selection</h3>
      <div id="inspectorContent">
        <pre id="selectionDetails">Nothing selected</pre>
      </div>
    </aside>
  </div>

  <script>
    const demoSchema = {
      users: {
        fields: {
          name: 'string',
          email: 'string',
          createdAt: 'timestamp'
        }
      },
      posts: {
        fields: {
          title: 'string',
          body: 'string',
          authorId: 'id(users)',
          createdAt: 'timestamp'
        }
      },
      comments: {
        fields: {
          postId: 'id(posts)',
          authorId: 'id(users)',
          text: 'string',
          createdAt: 'timestamp'
        }
      }
    };

    const state = {
      schema: JSON.parse(localStorage.getItem('schema') || JSON.stringify(demoSchema)),
      selectedTable: null,
      filterText: '',
      activeTab: 'graph',
      steps: JSON.parse(localStorage.getItem('steps') || '[]'),
      functions: JSON.parse(localStorage.getItem('functions') || '{}'),
      currentFunction: localStorage.getItem('currentFunction') || null,
      layout: JSON.parse(localStorage.getItem('layout') || '{}')
    };

    const tableListEl = document.getElementById('tableList');
    const tableSearchEl = document.getElementById('tableSearch');
    const nodesEl = document.getElementById('nodes');
    const connectionsEl = document.getElementById('connections');
    const inspectorEl = document.getElementById('selectionDetails');
    const inspectorContentEl = document.getElementById('inspectorContent');
    const connectBtn = document.getElementById('connectBtn');
    const endpointInput = document.getElementById('endpointInput');
    const graphTab = document.getElementById('graphTab');
    const jsonTab = document.getElementById('jsonTab');
    const functionsTab = document.getElementById('functionsTab');
    const jsonView = document.getElementById('jsonView');
    const jsonEditor = document.getElementById('jsonEditor');
    const applyJsonBtn = document.getElementById('applyJsonBtn');
    const formatJsonBtn = document.getElementById('formatJsonBtn');
    const addTableBtn = document.getElementById('addTableBtn');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const functionsView = document.getElementById('functionsView');
    const stepsList = document.getElementById('stepsList');
    const addStepBtn = document.getElementById('addStepBtn');
    const runChainBtn = document.getElementById('runChainBtn');
    const runChainStatus = document.getElementById('runChainStatus');
    const chainResult = document.getElementById('chainResult');
    const functionsSelect = document.getElementById('functionsSelect');
    const validateBtn = document.getElementById('validateBtn');
    const shareBtn = document.getElementById('shareBtn');
    const functionNameInput = document.getElementById('functionNameInput');
    const newFunctionBtn = document.getElementById('newFunctionBtn');
    const saveFunctionBtn = document.getElementById('saveFunctionBtn');
    const deleteFunctionBtn = document.getElementById('deleteFunctionBtn');
    const exportFunctionsBtn = document.getElementById('exportFunctionsBtn');
    const importFunctionsBtn = document.getElementById('importFunctionsBtn');
    const paramsEditor = document.getElementById('paramsEditor');

    function getTables(schema) {
      return Object.keys(schema).sort();
    }

    function getFields(table) {
      return Object.entries(table.fields);
    }

    function isIdType(typeString) {
      const match = /^id\(([^)]+)\)$/i.exec(typeString.trim());
      return match ? match[1] : null;
    }

    function layoutNodes(tables) {
      const positions = {};
      const cols = Math.ceil(Math.sqrt(tables.length));
      const spacingX = 360;
      const spacingY = 260;
      tables.forEach((tableName, index) => {
        const saved = state.layout[tableName];
        if (saved) {
          positions[tableName] = { x: saved.x, y: saved.y };
          return;
        }
        const col = index % cols;
        const row = Math.floor(index / cols);
        positions[tableName] = {
          x: 60 + col * spacingX,
          y: 60 + row * spacingY
        };
      });
      return positions;
    }

    function renderTableList() {
      const tables = getTables(state.schema);
      const filtered = state.filterText
        ? tables.filter(t => t.toLowerCase().includes(state.filterText.toLowerCase()))
        : tables;
      tableListEl.innerHTML = '';
      filtered.forEach(t => {
        const item = document.createElement('div');
        item.className = 'table-item' + (state.selectedTable === t ? ' active' : '');
        item.innerHTML = `<span>${t}</span><span class="node-badge">${Object.keys(state.schema[t].fields).length} fields</span>`;
        item.onclick = () => {
          state.selectedTable = t;
          renderAll();
          showTableEditor(t);
        };
        tableListEl.appendChild(item);
      });
    }

    function renderNodes() {
      const tables = getTables(state.schema);
      const positions = layoutNodes(tables);
      nodesEl.innerHTML = '';
      tables.forEach(tableName => {
        const node = document.createElement('div');
        node.className = 'node';
        node.style.left = positions[tableName].x + 'px';
        node.style.top = positions[tableName].y + 'px';
        node.dataset.table = tableName;

        const header = document.createElement('div');
        header.className = 'node-header';
        header.innerHTML = `
          <div class="node-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M4 7.5L12 3l8 4.5v9L12 21l-8-4.5v-9z" stroke="#60a5fa" stroke-width="1.25"/>
            </svg>
            <span>${tableName}</span>
          </div>
          <span class="node-badge">${Object.keys(state.schema[tableName].fields).length} fields</span>
        `;

        makeDraggable(node, tableName);

        const fields = document.createElement('div');
        fields.className = 'fields';

        getFields(state.schema[tableName]).forEach(([name, type]) => {
          const fn = document.createElement('div');
          fn.className = 'field-name';
          fn.textContent = name;
          fn.dataset.table = tableName;
          fn.dataset.field = name;

          const ft = document.createElement('div');
          ft.className = 'field-type';
          ft.textContent = type;

          fn.onclick = () => {
            showSelection({ type: 'field', table: tableName, name, fieldType: type });
          };

          fields.appendChild(fn);
          fields.appendChild(ft);
        });

        node.appendChild(header);
        node.appendChild(fields);
        nodesEl.appendChild(node);
      });
    }

    function pathD(x1, y1, x2, y2) {
      const dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
      const c1x = x1 + dx;
      const c1y = y1;
      const c2x = x2 - dx;
      const c2y = y2;
      return `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`;
    }

    function getFieldAnchorPosition(tableName, fieldIndex, positions) {
      const baseX = positions[tableName].x;
      const baseY = positions[tableName].y;
      const headerHeight = 44;
      const fieldRowHeight = 32;
      const paddingY = 12;
      const x = baseX + 12;
      const y = baseY + headerHeight + paddingY + fieldIndex * fieldRowHeight + 16;
      return { x, y };
    }

    function getNodeHeaderAnchor(tableName, positions) {
      return {
        x: positions[tableName].x + 260,
        y: positions[tableName].y + 22
      };
    }

    function renderConnections() {
      const tables = getTables(state.schema);
      const positions = layoutNodes(tables);
      const svgns = 'http://www.w3.org/2000/svg';
      connectionsEl.innerHTML = '';

      tables.forEach(sourceTable => {
        const fields = getFields(state.schema[sourceTable]);
        fields.forEach(([fname, ftype], index) => {
          const refTable = isIdType(ftype);
          if (!refTable || !state.schema[refTable]) return;

          const start = getFieldAnchorPosition(sourceTable, index, positions);
          const end = getNodeHeaderAnchor(refTable, positions);

          const path = document.createElementNS(svgns, 'path');
          path.setAttribute('d', pathD(start.x, start.y, end.x, end.y));
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', 'url(#gradBlue)');
          path.setAttribute('stroke-width', '2');
          path.setAttribute('opacity', '0.9');

          const marker = document.createElementNS(svgns, 'circle');
          marker.setAttribute('cx', String(end.x));
          marker.setAttribute('cy', String(end.y));
          marker.setAttribute('r', '3');
          marker.setAttribute('fill', '#60a5fa');

          connectionsEl.appendChild(path);
          connectionsEl.appendChild(marker);
        });
      });

      const defs = document.createElementNS(svgns, 'defs');
      const grad = document.createElementNS(svgns, 'linearGradient');
      grad.setAttribute('id', 'gradBlue');
      grad.setAttribute('x1', '0%');
      grad.setAttribute('y1', '0%');
      grad.setAttribute('x2', '100%');
      grad.setAttribute('y2', '0%');

      const stop1 = document.createElementNS(svgns, 'stop');
      stop1.setAttribute('offset', '0%');
      stop1.setAttribute('stop-color', '#60a5fa');
      stop1.setAttribute('stop-opacity', '0.9');

      const stop2 = document.createElementNS(svgns, 'stop');
      stop2.setAttribute('offset', '100%');
      stop2.setAttribute('stop-color', '#a78bfa');
      stop2.setAttribute('stop-opacity', '0.9');

      grad.appendChild(stop1);
      grad.appendChild(stop2);
      defs.appendChild(grad);
      connectionsEl.appendChild(defs);
    }

    function showSelection(payload) {
      inspectorContentEl.innerHTML = `<pre id="selectionDetails">${JSON.stringify(payload, null, 2)}</pre>`;
    }

    function showTableEditor(tableName) {
      const table = state.schema[tableName];
      const fields = Object.entries(table.fields);
      const fieldsRows = fields.map(([fname, ftype]) => `
        <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center;">
          <input data-edit="fname" data-original="${fname}" value="${fname}" style="flex:1; background: rgba(30,41,59,.6); border:1px solid #334155; color:#e2e8f0; padding:6px 8px; border-radius:6px;"/>
          <input data-edit="ftype" data-original="${fname}" value="${ftype}" style="width:220px; background: rgba(30,41,59,.6); border:1px solid #334155; color:#e2e8f0; padding:6px 8px; border-radius:6px;"/>
          <button data-action="remove-field" data-field="${fname}" class="chip">Remove</button>
        </div>
      `).join('');
      inspectorContentEl.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <strong>${tableName}</strong>
          <div style="display:flex; gap:8px;">
            <button id="renameTableBtn" class="chip">Rename</button>
            <button id="deleteTableBtn" class="chip">Delete</button>
          </div>
        </div>
        <div style="margin-bottom:8px;">
          <button id="addFieldBtn" class="btn-primary">+ Field</button>
        </div>
        ${fieldsRows || '<div style="color:#94a3b8;">No fields yet</div>'}
        <div style="margin-top:8px; display:flex; gap:8px;">
          <button id="saveTableBtn" class="btn-primary">Save</button>
          <button id="discardTableBtn" class="chip">Discard</button>
        </div>
      `;

      inspectorContentEl.querySelectorAll('[data-action="remove-field"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const fname = btn.dataset.field;
          delete state.schema[tableName].fields[fname];
          localStorage.setItem('schema', JSON.stringify(state.schema));
          renderAll();
          showTableEditor(tableName);
        });
      });

      const handleSave = () => {
        const nameInputs = inspectorContentEl.querySelectorAll('input[data-edit="fname"]');
        const typeInputs = inspectorContentEl.querySelectorAll('input[data-edit="ftype"]');
        const next = {};
        nameInputs.forEach((inp, idx) => {
          const newName = inp.value.trim();
          const orig = inp.dataset.original;
          const newType = typeInputs[idx].value.trim();
          if (!newName) return;
          next[newName] = newType || 'string';
        });
        state.schema[tableName].fields = next;
        localStorage.setItem('schema', JSON.stringify(state.schema));
        renderAll();
        showTableEditor(tableName);
      };

      inspectorContentEl.querySelector('#saveTableBtn').addEventListener('click', handleSave);
      inspectorContentEl.querySelector('#discardTableBtn').addEventListener('click', () => showTableEditor(tableName));
      inspectorContentEl.querySelector('#addFieldBtn').addEventListener('click', () => {
        const unique = 'field_' + Math.random().toString(36).slice(2,6);
        state.schema[tableName].fields[unique] = 'string';
        localStorage.setItem('schema', JSON.stringify(state.schema));
        renderAll();
        showTableEditor(tableName);
      });
      inspectorContentEl.querySelector('#deleteTableBtn').addEventListener('click', () => {
        delete state.schema[tableName];
        localStorage.setItem('schema', JSON.stringify(state.schema));
        state.selectedTable = null;
        renderAll();
        showSelection({ type: 'info', message: 'Table deleted' });
      });
      inspectorContentEl.querySelector('#renameTableBtn').addEventListener('click', () => {
        const newName = prompt('New table name', tableName);
        if (!newName || newName === tableName) return;
        state.schema[newName] = state.schema[tableName];
        delete state.schema[tableName];
        localStorage.setItem('schema', JSON.stringify(state.schema));
        state.selectedTable = newName;
        renderAll();
        showTableEditor(newName);
      });
    }

    function setActiveTab(tab) {
      state.activeTab = tab;
      graphTab.classList.toggle('active', tab === 'graph');
      jsonTab.classList.toggle('active', tab === 'json');
      functionsTab.classList.toggle('active', tab === 'functions');

      const showGraph = tab === 'graph';
      nodesEl.style.display = showGraph ? 'block' : 'none';
      connectionsEl.style.display = showGraph ? 'block' : 'none';
      jsonView.style.display = tab === 'json' ? 'block' : 'none';
      functionsView.style.display = tab === 'functions' ? 'block' : 'none';

      if (tab === 'json') {
        jsonEditor.value = JSON.stringify(state.schema, null, 2);
      }
      if (tab === 'graph') {
        renderConnections();
      }
    }

    function renderAll() {
      renderTableList();
      renderNodes();
      renderConnections();
      renderSteps();
      renderFunctionsSelect();
    }

    function renderFunctionsSelect() {
      const names = Object.keys(state.functions).sort();
      functionsSelect.innerHTML = '<option value="">Select function...</option>' + names.map(n => `<option ${state.currentFunction===n?'selected':''}>${n}</option>`).join('');
      functionNameInput.value = state.currentFunction || '';
      if (state.currentFunction && state.functions[state.currentFunction]) {
        state.steps = state.functions[state.currentFunction].steps || [];
        paramsEditor.value = JSON.stringify(state.functions[state.currentFunction].params || {}, null, 2);
      }
    }

    function renderSteps() {
      stepsList.innerHTML = '';
      if (!state.steps.length) {
        const empty = document.createElement('div');
        empty.style.color = '#94a3b8';
        empty.textContent = 'No steps. Click + Step to add one.';
        stepsList.appendChild(empty);
        return;
      }
      state.steps.forEach((step, idx) => {
        const row = document.createElement('div');
        row.className = 'table-item';
        row.innerHTML = `
          <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
            <select data-k="type" style="background: rgba(30,41,59,.6); border:1px solid #334155; color:#e2e8f0; padding:6px 8px; border-radius:6px;">
              <option ${step.type==='ReadTable'?'selected':''}>ReadTable</option>
              <option ${step.type==='Filter'?'selected':''}>Filter</option>
              <option ${step.type==='SelectFields'?'selected':''}>SelectFields</option>
              <option ${step.type==='Join'?'selected':''}>Join</option>
              <option ${step.type==='SortBy'?'selected':''}>SortBy</option>
              <option ${step.type==='Limit'?'selected':''}>Limit</option>
            </select>
            <input data-k="arg1" placeholder="arg1" value="${step.arg1||''}" style="min-width:160px; background: rgba(30,41,59,.6); border:1px solid #334155; color:#e2e8f0; padding:6px 8px; border-radius:6px;"/>
            <input data-k="arg2" placeholder="arg2" value="${step.arg2||''}" style="min-width:160px; background: rgba(30,41,59,.6); border:1px solid #334155; color:#e2e8f0; padding:6px 8px; border-radius:6px;"/>
          </div>
          <div style="display:flex; gap:8px;">
            <button data-action="up" class="chip">↑</button>
            <button data-action="down" class="chip">↓</button>
            <button data-action="remove" class="chip">Remove</button>
          </div>
        `;
        row.querySelectorAll('select, input').forEach(el => {
          el.addEventListener('change', () => {
            const key = el.dataset.k;
            const value = el.tagName === 'SELECT' ? el.value : el.value;
            state.steps[idx][key] = value;
            localStorage.setItem('steps', JSON.stringify(state.steps));
          });
        });
        row.querySelector('[data-action="remove"]').addEventListener('click', () => {
          state.steps.splice(idx,1);
          localStorage.setItem('steps', JSON.stringify(state.steps));
          renderSteps();
        });
        row.querySelector('[data-action="up"]').addEventListener('click', () => {
          if (idx === 0) return;
          const tmp = state.steps[idx-1];
          state.steps[idx-1] = state.steps[idx];
          state.steps[idx] = tmp;
          localStorage.setItem('steps', JSON.stringify(state.steps));
          renderSteps();
        });
        row.querySelector('[data-action="down"]').addEventListener('click', () => {
          if (idx === state.steps.length-1) return;
          const tmp = state.steps[idx+1];
          state.steps[idx+1] = state.steps[idx];
          state.steps[idx] = tmp;
          localStorage.setItem('steps', JSON.stringify(state.steps));
          renderSteps();
        });
        stepsList.appendChild(row);
      });
    }

    addStepBtn.addEventListener('click', () => {
      state.steps.push({ type: 'ReadTable', arg1: '', arg2: '' });
      localStorage.setItem('steps', JSON.stringify(state.steps));
      if (state.currentFunction) persistCurrentFunction();
      renderSteps();
    });

    functionsSelect.addEventListener('change', () => {
      const name = functionsSelect.value || null;
      state.currentFunction = name;
      localStorage.setItem('currentFunction', name || '');
      if (name) {
        const fn = state.functions[name] || { steps: [], params: {} };
        state.steps = fn.steps || [];
        paramsEditor.value = JSON.stringify(fn.params || {}, null, 2);
        localStorage.setItem('steps', JSON.stringify(state.steps));
      }
      renderSteps();
    });

    function persistCurrentFunction() {
      if (!state.currentFunction) return;
      let params = {};
      try { params = JSON.parse(paramsEditor.value || '{}'); } catch { params = {}; }
      state.functions[state.currentFunction] = { steps: state.steps, params };
      localStorage.setItem('functions', JSON.stringify(state.functions));
    }

    newFunctionBtn.addEventListener('click', () => {
      const name = (functionNameInput.value || '').trim() || 'function_' + Math.random().toString(36).slice(2,6);
      if (state.functions[name]) {
        showSelection({ type: 'error', message: 'Function name exists' });
        return;
      }
      state.functions[name] = { steps: [], params: {} };
      state.currentFunction = name;
      localStorage.setItem('functions', JSON.stringify(state.functions));
      localStorage.setItem('currentFunction', name);
      functionNameInput.value = name;
      renderFunctionsSelect();
      renderSteps();
    });

    saveFunctionBtn.addEventListener('click', () => {
      const name = (functionNameInput.value || '').trim();
      if (!name) { showSelection({ type: 'error', message: 'Function name required' }); return; }
      if (state.currentFunction && name !== state.currentFunction && state.functions[name]) {
        showSelection({ type: 'error', message: 'Target function name exists' });
        return;
      }
      let params = {};
      try { params = JSON.parse(paramsEditor.value || '{}'); } catch { showSelection({ type: 'error', message: 'Params must be valid JSON' }); return; }

      // Rename if needed
      if (state.currentFunction && name !== state.currentFunction) {
        state.functions[name] = state.functions[state.currentFunction];
        delete state.functions[state.currentFunction];
        state.currentFunction = name;
      }

      state.functions[name] = { steps: state.steps, params };
      localStorage.setItem('functions', JSON.stringify(state.functions));
      localStorage.setItem('currentFunction', name);
      renderFunctionsSelect();
      showSelection({ type: 'info', message: 'Function saved' });
    });

    deleteFunctionBtn.addEventListener('click', () => {
      if (!state.currentFunction) return;
      const name = state.currentFunction;
      delete state.functions[name];
      localStorage.setItem('functions', JSON.stringify(state.functions));
      state.currentFunction = null;
      localStorage.removeItem('currentFunction');
      state.steps = [];
      localStorage.setItem('steps', JSON.stringify(state.steps));
      paramsEditor.value = '{}';
      renderFunctionsSelect();
      renderSteps();
    });

    exportFunctionsBtn.addEventListener('click', () => {
      const data = JSON.stringify(state.functions, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'functions.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    importFunctionsBtn.addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'application/json';
      inp.onchange = async () => {
        const file = inp.files[0];
        if (!file) return;
        const text = await file.text();
        try {
          const parsed = JSON.parse(text);
          state.functions = parsed;
          localStorage.setItem('functions', JSON.stringify(state.functions));
          renderFunctionsSelect();
          showSelection({ type: 'info', message: 'Functions imported' });
        } catch (e) {
          showSelection({ type: 'error', message: 'Invalid JSON' });
        }
      };
      inp.click();
    });

    function runChain(inputData, params = {}) {
      let data = inputData;
      for (const step of state.steps) {
        if (step.type === 'ReadTable') {
          const t = interpolate(step.arg1, params);
          if (!t || !state.schema[t]) throw new Error('ReadTable: missing or unknown table');
          data = { rows: demoRows(t) };
        } else if (step.type === 'Filter') {
          const expr = interpolate(step.arg1, params);
          if (!expr) continue;
          const fn = new Function('row', `with(row){ return (${expr}); }`);
          data.rows = data.rows.filter(fn);
        } else if (step.type === 'SelectFields') {
          const list = (interpolate(step.arg1, params)||'').split(',').map(s => s.trim()).filter(Boolean);
          if (!list.length) continue;
          data.rows = data.rows.map(r => Object.fromEntries(list.map(k => [k, r[k]])));
        } else if (step.type === 'Join') {
          const target = interpolate(step.arg1, params);
          const on = interpolate(step.arg2, params); // format: leftKey=rightKey
          if (!target || !on) continue;
          const [leftKey, rightKey] = on.split('=').map(s => s.trim());
          const rightRows = demoRows(target);
          const index = new Map(rightRows.map(rr => [rr[rightKey], rr]));
          data.rows = data.rows.map(lr => ({ ...lr, [target]: index.get(lr[leftKey]) || null }));
        } else if (step.type === 'SortBy') {
          const dir = (interpolate(step.arg2, params) || 'asc').toLowerCase();
          const key = interpolate(step.arg1, params);
          if (!key) continue;
          data.rows = [...data.rows].sort((a,b) => {
            const av = a[key]; const bv = b[key];
            if (av == null && bv == null) return 0;
            if (av == null) return 1;
            if (bv == null) return -1;
            if (av < bv) return dir==='asc' ? -1 : 1;
            if (av > bv) return dir==='asc' ? 1 : -1;
            return 0;
          });
        } else if (step.type === 'Limit') {
          const n = parseInt(interpolate(step.arg1, params) || '10', 10);
          if (!isNaN(n)) data.rows = data.rows.slice(0, Math.max(0, n));
        }
      }
      return data.rows;
    }

    function interpolate(str, params) {
      if (!str) return str;
      return str.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, k) => {
        const segs = k.split('.');
        let cur = params;
        for (const s of segs) cur = cur?.[s];
        return cur ?? '';
      });
    }

    function b64EncodeUnicode(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      bytes.forEach(b => binary += String.fromCharCode(b));
      return btoa(binary);
    }

    function b64DecodeUnicode(b64) {
      const binary = atob(b64);
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function demoRows(table) {
      // generates minimal synthetic rows for preview
      const fields = Object.keys(state.schema[table].fields);
      return Array.from({ length: 5 }).map((_, i) => Object.fromEntries(fields.map(f => [f, sampleValue(f, i, table)])));
    }

    function sampleValue(field, i, table) {
      const type = state.schema[table].fields[field];
      const ref = isIdType(type);
      if (ref) return `${ref}_id_${i}`;
      if (/title|name/i.test(field)) return `${field}_${i}`;
      if (/email/i.test(field)) return `user${i}@example.com`;
      if (/created/i.test(field)) return new Date(Date.now() - i*86400000).toISOString();
      if (/id$/i.test(field)) return `${table}_id_${i}`;
      return typeof i === 'number' ? i : `${field}_${i}`;
    }

    runChainBtn.addEventListener('click', () => {
      try {
        runChainStatus.textContent = 'Running...';
        let params = {};
        try { params = JSON.parse(paramsEditor.value || '{}'); } catch { params = {}; }
        const out = runChain({}, params);
        chainResult.textContent = JSON.stringify(out, null, 2);
        runChainStatus.textContent = 'Done';
      } catch (e) {
        runChainStatus.textContent = 'Error';
        chainResult.textContent = String(e.message || e);
      }
    });

    chainResult.textContent = '';

      state.filterText = e.target.value;
      renderTableList();
    });

    graphTab.addEventListener('click', () => setActiveTab('graph'));
    jsonTab.addEventListener('click', () => setActiveTab('json'));
    functionsTab.addEventListener('click', () => setActiveTab('functions'));

    formatJsonBtn.addEventListener('click', () => {
      try { jsonEditor.value = JSON.stringify(JSON.parse(jsonEditor.value), null, 2); } catch {}
    });

    applyJsonBtn.addEventListener('click', () => {
      try {
        const next = JSON.parse(jsonEditor.value);
        state.schema = next;
        localStorage.setItem('schema', JSON.stringify(state.schema));
        renderAll();
        showSelection({ type: 'info', message: 'Schema applied' });
      } catch (e) {
        showSelection({ type: 'error', message: 'Invalid JSON' });
      }
    });

    connectBtn.addEventListener('click', () => {
      const raw = endpointInput.value.trim();
      if (!raw) {
        state.schema = demoSchema;
        localStorage.setItem('schema', JSON.stringify(state.schema));
        state.selectedTable = null;
        renderAll();
        showSelection({ type: 'info', message: 'Loaded demo schema' });
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        state.schema = parsed;
        localStorage.setItem('schema', JSON.stringify(state.schema));
        state.selectedTable = null;
        renderAll();
        showSelection({ type: 'info', message: 'Loaded pasted JSON schema' });
      } catch (e) {
        showSelection({ type: 'error', message: 'Input is not valid JSON. Paste a schema JSON or leave empty to load demo.' });
      }
    });

    addTableBtn.addEventListener('click', () => {
      const base = 'table_' + Math.random().toString(36).slice(2,6);
      let name = prompt('New table name', base) || base;
      name = name.trim();
      if (!name) return;
      if (state.schema[name]) {
        showSelection({ type: 'error', message: 'Table already exists' });
        return;
      }
      state.schema[name] = { fields: {} };
      localStorage.setItem('schema', JSON.stringify(state.schema));
      state.selectedTable = name;
      renderAll();
      showTableEditor(name);
    });

    exportBtn.addEventListener('click', () => {
      const data = JSON.stringify(state.schema, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'schema.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    importBtn.addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'application/json';
      inp.onchange = async () => {
        const file = inp.files[0];
        if (!file) return;
        const text = await file.text();
        try {
          const parsed = JSON.parse(text);
          state.schema = parsed;
          localStorage.setItem('schema', JSON.stringify(state.schema));
          renderAll();
          setActiveTab('graph');
          showSelection({ type: 'info', message: 'Schema imported' });
        } catch (e) {
          showSelection({ type: 'error', message: 'Invalid JSON file' });
        }
      };
      inp.click();
    });

    function makeDraggable(el, tableName) {
      let startX = 0, startY = 0, originX = 0, originY = 0, dragging = false;
      const onDown = (e) => {
        if (!(e.target.closest('.node-header') || e.target.classList.contains('node-header'))) return;
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = el.getBoundingClientRect();
        originX = rect.left + window.scrollX;
        originY = rect.top + window.scrollY;
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };
      const onMove = (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const x = originX + dx - nodesEl.getBoundingClientRect().left + nodesEl.scrollLeft;
        const y = originY + dy - nodesEl.getBoundingClientRect().top + nodesEl.scrollTop;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        state.layout[tableName] = { x, y };
        localStorage.setItem('layout', JSON.stringify(state.layout));
        renderConnections();
      };
      const onUp = () => {
        dragging = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      el.addEventListener('mousedown', onDown);
    }

    function validateSchema() {
      const issues = [];
      const tables = Object.keys(state.schema);
      for (const t of tables) {
        const fields = state.schema[t]?.fields || {};
        for (const [name, type] of Object.entries(fields)) {
          const ref = isIdType(type);
          if (ref && !state.schema[ref]) {
            issues.push(`Field ${t}.${name} references missing table '${ref}'`);
          }
        }
      }
      return issues;
    }

    validateBtn.addEventListener('click', () => {
      const issues = validateSchema();
      if (!issues.length) {
        showSelection({ type: 'ok', message: 'Schema is valid' });
      } else {
        showSelection({ type: 'validation', errors: issues });
      }
    });

    window.addEventListener('resize', () => {
      renderConnections();
    });

    shareBtn.addEventListener('click', () => {
      const payload = {
        schema: state.schema,
        functions: state.functions,
        layout: state.layout
      };
      const encoded = b64EncodeUnicode(JSON.stringify(payload));
      const url = `${location.origin}${location.pathname}#data=${encoded}`;
      navigator.clipboard.writeText(url).then(() => {
        showSelection({ type: 'info', message: 'Share link copied to clipboard' });
      });
    });

    // Load from URL if present
    (function restoreFromHash(){
      const m = /#data=([^&]+)/.exec(location.hash);
      if (!m) return;
      try {
        const json = b64DecodeUnicode(m[1]);
        const payload = JSON.parse(json);
        if (payload.schema) state.schema = payload.schema;
        if (payload.functions) state.functions = payload.functions;
        if (payload.layout) state.layout = payload.layout;
        localStorage.setItem('schema', JSON.stringify(state.schema));
        localStorage.setItem('functions', JSON.stringify(state.functions));
        localStorage.setItem('layout', JSON.stringify(state.layout));
      } catch {}
    })();

    setActiveTab(state.activeTab);
    renderAll();
  </script>
</body>
