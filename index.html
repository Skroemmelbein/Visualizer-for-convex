<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convex Schema Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0c0d14 0%, #161b2b 100%);
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      background: rgba(12, 13, 20, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      color: #60a5fa;
      filter: drop-shadow(0 2px 6px rgba(59, 130, 246, 0.4));
    }

    .connection-panel {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .input-group {
      position: relative;
    }

    .input-group input {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: #e2e8f0;
      font-size: 0.9rem;
      width: 350px;
      transition: all 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      background: rgba(30, 41, 59, 0.9);
    }

    .input-group input::placeholder {
      color: #64748b;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1.5rem;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .workspace {
      position: fixed;
      top: 80px;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
    }

    .sidebar {
      width: 300px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-right: 1px solid #1e293b;
      padding: 1.25rem;
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar .search {
      margin-bottom: 0.75rem;
    }

    .sidebar .search input {
      width: 100%;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.6rem 0.75rem;
      color: #e2e8f0;
      font-size: 0.9rem;
    }

    .table-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .table-item {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-item:hover {
      background: rgba(30, 41, 59, 0.75);
      border-color: #3b82f6;
      transform: translateY(-1px);
    }

    .table-item.active {
      background: rgba(30, 58, 138, 0.5);
      border-color: #60a5fa;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #1e293b;
      background: rgba(2, 6, 23, 0.4);
      backdrop-filter: blur(8px);
    }

    .chip {
      border: 1px solid #334155;
      background: rgba(30, 41, 59, 0.6);
      color: #e2e8f0;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .chip.active {
      border-color: #3b82f6;
      background: rgba(30, 64, 175, 0.35);
    }

    .canvas-wrap {
      position: relative;
      flex: 1;
      overflow: auto;
      background: radial-gradient(1200px 600px at 20% -20%, rgba(59, 130, 246, 0.12), transparent),
                  radial-gradient(900px 500px at 80% 0%, rgba(139, 92, 246, 0.12), transparent);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(51, 65, 85, 0.35) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(51, 65, 85, 0.35) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 60%, transparent 100%);
      pointer-events: none;
    }

    .nodes {
      position: relative;
      min-width: 1200px;
      min-height: 800px;
      padding: 40px;
    }

    .node {
      position: absolute;
      width: 280px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 0.75rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
    }

    .node:hover {
      border-color: #3b82f6;
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
    }

    .node-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid #1f2937;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.85));
    }

    .node-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .node-badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid #334155;
      color: #cbd5e1;
      background: rgba(2, 6, 23, 0.5);
    }

    .fields {
      padding: 0.5rem 0.5rem 0.6rem 0.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 8px;
      align-items: center;
    }

    .field-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.85rem;
      color: #e5e7eb;
      padding: 0.35rem 0.5rem;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      border-radius: 0.375rem;
    }

    .field-type {
      font-size: 0.75rem;
      color: #93c5fd;
      background: rgba(30, 64, 175, 0.35);
      border: 1px solid #1d4ed8;
      padding: 0.25rem 0.45rem;
      border-radius: 0.375rem;
    }

    svg.connections {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .inspector {
      width: 360px;
      border-left: 1px solid #1e293b;
      background: rgba(2, 6, 23, 0.55);
      padding: 1rem;
      overflow-y: auto;
    }

    .inspector h3 {
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }

    .inspector pre {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem;
      overflow: auto;
      font-size: 0.85rem;
      line-height: 1.45;
    }

    @media (max-width: 1200px) {
      .inspector {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 7.5L12 3l8 4.5v9L12 21l-8-4.5v-9z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 3v18M4 7.5l8 4.5 8-4.5" stroke="currentColor" stroke-opacity="0.5"/>
      </svg>
      <h1>Convex Schema Visualizer</h1>
    </div>
    <div class="connection-panel">
      <div class="input-group">
        <input id="endpointInput" type="text" placeholder="Convex deployment URL or paste schema JSON..." />
      </div>
      <button id="connectBtn" class="btn-primary">Load</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <h3>
        <span>Tables</span>
      </h3>
      <div class="search">
        <input id="tableSearch" type="text" placeholder="Filter tables..." />
      </div>
      <div id="tableList" class="table-list"></div>
    </aside>

    <main class="content">
      <div class="toolbar">
        <button id="graphTab" class="chip active">Graph</button>
        <button id="jsonTab" class="chip">JSON</button>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="grid"></div>
        <svg class="connections" id="connections" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="nodes" id="nodes"></div>
      </div>
    </main>

    <aside class="inspector" id="inspector">
      <h3>Selection</h3>
      <pre id="selectionDetails">Nothing selected</pre>
    </aside>
  </div>

  <script>
    const demoSchema = {
      users: {
        fields: {
          name: 'string',
          email: 'string',
          createdAt: 'timestamp'
        }
      },
      posts: {
        fields: {
          title: 'string',
          body: 'string',
          authorId: 'id(users)',
          createdAt: 'timestamp'
        }
      },
      comments: {
        fields: {
          postId: 'id(posts)',
          authorId: 'id(users)',
          text: 'string',
          createdAt: 'timestamp'
        }
      }
    };

    const state = {
      schema: demoSchema,
      selectedTable: null,
      filterText: ''
    };

    const tableListEl = document.getElementById('tableList');
    const tableSearchEl = document.getElementById('tableSearch');
    const nodesEl = document.getElementById('nodes');
    const connectionsEl = document.getElementById('connections');
    const inspectorEl = document.getElementById('selectionDetails');
    const connectBtn = document.getElementById('connectBtn');
    const endpointInput = document.getElementById('endpointInput');

    function getTables(schema) {
      return Object.keys(schema).sort();
    }

    function getFields(table) {
      return Object.entries(table.fields);
    }

    function isIdType(typeString) {
      const match = /^id\(([^)]+)\)$/i.exec(typeString.trim());
      return match ? match[1] : null;
    }

    function layoutNodes(tables) {
      const positions = {};
      const cols = Math.ceil(Math.sqrt(tables.length));
      const spacingX = 360;
      const spacingY = 260;
      tables.forEach((tableName, index) => {
        const col = index % cols;
        const row = Math.floor(index / cols);
        positions[tableName] = {
          x: 60 + col * spacingX,
          y: 60 + row * spacingY
        };
      });
      return positions;
    }

    function renderTableList() {
      const tables = getTables(state.schema);
      const filtered = state.filterText
        ? tables.filter(t => t.toLowerCase().includes(state.filterText.toLowerCase()))
        : tables;
      tableListEl.innerHTML = '';
      filtered.forEach(t => {
        const item = document.createElement('div');
        item.className = 'table-item' + (state.selectedTable === t ? ' active' : '');
        item.innerHTML = `<span>${t}</span><span class="node-badge">${Object.keys(state.schema[t].fields).length} fields</span>`;
        item.onclick = () => {
          state.selectedTable = t;
          renderAll();
          showSelection({ type: 'table', name: t, details: state.schema[t] });
        };
        tableListEl.appendChild(item);
      });
    }

    function renderNodes() {
      const tables = getTables(state.schema);
      const positions = layoutNodes(tables);
      nodesEl.innerHTML = '';
      tables.forEach(tableName => {
        const node = document.createElement('div');
        node.className = 'node';
        node.style.left = positions[tableName].x + 'px';
        node.style.top = positions[tableName].y + 'px';

        const header = document.createElement('div');
        header.className = 'node-header';
        header.innerHTML = `
          <div class="node-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M4 7.5L12 3l8 4.5v9L12 21l-8-4.5v-9z" stroke="#60a5fa" stroke-width="1.25"/>
            </svg>
            <span>${tableName}</span>
          </div>
          <span class="node-badge">${Object.keys(state.schema[tableName].fields).length} fields</span>
        `;

        const fields = document.createElement('div');
        fields.className = 'fields';

        getFields(state.schema[tableName]).forEach(([name, type]) => {
          const fn = document.createElement('div');
          fn.className = 'field-name';
          fn.textContent = name;
          fn.dataset.table = tableName;
          fn.dataset.field = name;

          const ft = document.createElement('div');
          ft.className = 'field-type';
          ft.textContent = type;

          fn.onclick = () => {
            showSelection({ type: 'field', table: tableName, name, fieldType: type });
          };

          fields.appendChild(fn);
          fields.appendChild(ft);
        });

        node.appendChild(header);
        node.appendChild(fields);
        nodesEl.appendChild(node);
      });
    }

    function pathD(x1, y1, x2, y2) {
      const dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
      const c1x = x1 + dx;
      const c1y = y1;
      const c2x = x2 - dx;
      const c2y = y2;
      return `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`;
    }

    function getFieldAnchorPosition(tableName, fieldIndex, positions) {
      const baseX = positions[tableName].x;
      const baseY = positions[tableName].y;
      const headerHeight = 44;
      const fieldRowHeight = 32;
      const paddingY = 12;
      const x = baseX + 12;
      const y = baseY + headerHeight + paddingY + fieldIndex * fieldRowHeight + 16;
      return { x, y };
    }

    function getNodeHeaderAnchor(tableName, positions) {
      return {
        x: positions[tableName].x + 260,
        y: positions[tableName].y + 22
      };
    }

    function renderConnections() {
      const tables = getTables(state.schema);
      const positions = layoutNodes(tables);
      const svgns = 'http://www.w3.org/2000/svg';
      connectionsEl.innerHTML = '';

      tables.forEach(sourceTable => {
        const fields = getFields(state.schema[sourceTable]);
        fields.forEach(([fname, ftype], index) => {
          const refTable = isIdType(ftype);
          if (!refTable || !state.schema[refTable]) return;

          const start = getFieldAnchorPosition(sourceTable, index, positions);
          const end = getNodeHeaderAnchor(refTable, positions);

          const path = document.createElementNS(svgns, 'path');
          path.setAttribute('d', pathD(start.x, start.y, end.x, end.y));
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', 'url(#gradBlue)');
          path.setAttribute('stroke-width', '2');
          path.setAttribute('opacity', '0.9');

          const marker = document.createElementNS(svgns, 'circle');
          marker.setAttribute('cx', String(end.x));
          marker.setAttribute('cy', String(end.y));
          marker.setAttribute('r', '3');
          marker.setAttribute('fill', '#60a5fa');

          connectionsEl.appendChild(path);
          connectionsEl.appendChild(marker);
        });
      });

      const defs = document.createElementNS(svgns, 'defs');
      const grad = document.createElementNS(svgns, 'linearGradient');
      grad.setAttribute('id', 'gradBlue');
      grad.setAttribute('x1', '0%');
      grad.setAttribute('y1', '0%');
      grad.setAttribute('x2', '100%');
      grad.setAttribute('y2', '0%');

      const stop1 = document.createElementNS(svgns, 'stop');
      stop1.setAttribute('offset', '0%');
      stop1.setAttribute('stop-color', '#60a5fa');
      stop1.setAttribute('stop-opacity', '0.9');

      const stop2 = document.createElementNS(svgns, 'stop');
      stop2.setAttribute('offset', '100%');
      stop2.setAttribute('stop-color', '#a78bfa');
      stop2.setAttribute('stop-opacity', '0.9');

      grad.appendChild(stop1);
      grad.appendChild(stop2);
      defs.appendChild(grad);
      connectionsEl.appendChild(defs);
    }

    function showSelection(payload) {
      inspectorEl.textContent = JSON.stringify(payload, null, 2);
    }

    function renderAll() {
      renderTableList();
      renderNodes();
      renderConnections();
    }

    tableSearchEl.addEventListener('input', (e) => {
      state.filterText = e.target.value;
      renderTableList();
    });

    connectBtn.addEventListener('click', () => {
      const raw = endpointInput.value.trim();
      if (!raw) {
        state.schema = demoSchema;
        state.selectedTable = null;
        renderAll();
        showSelection({ type: 'info', message: 'Loaded demo schema' });
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        state.schema = parsed;
        state.selectedTable = null;
        renderAll();
        showSelection({ type: 'info', message: 'Loaded pasted JSON schema' });
      } catch (e) {
        showSelection({ type: 'error', message: 'Input is not valid JSON. Paste a schema JSON or leave empty to load demo.' });
      }
    });

    window.addEventListener('resize', () => {
      renderConnections();
    });

    renderAll();
  </script>
</body>
</html>
